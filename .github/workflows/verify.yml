name: Verify Skill

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the fixed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify package integrity
        shell: pwsh
        run: node scripts/bridge.mjs verify
      - name: Run synthetic and temporary-file tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object FullName)
          node --test --test-concurrency=1 @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the CLI launcher without opening an instance
        shell: pwsh
        run: |
          & ./scripts/ds-bot.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
